<!DOCTYPE html>
<html>
<head>
    <title>Coffee Stock Dashboard</title>

    <meta http-equiv="refresh" content="5">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:500px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        .percentage{
            font-size:50px;
            font-weight:bold;
            color:#28a745;
        }

        .progress{
            width:100%;
            height:30px;
            background:#ddd;
            border-radius:15px;
            overflow:hidden;
            margin-top:15px;
        }

        .bar{
            height:100%;
            width:{{ percentage }}%;
            background:#28a745;
        }

        .status{
            font-size:28px;
            margin-top:20px;
            font-weight:bold;
        }

        .info{
            margin-top:15px;
            font-size:18px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>☕ Coffee Stock Management</h1>

    <div class="percentage">
        {{ percentage }}%
    </div>

    <div class="progress">
        <div class="bar"></div>
    </div>

    <div class="status">
        {{ status }}
    </div>

    <div class="info">
        Distance: {{ distance }} cm
    </div>

    <div class="info">
        Last Update: {{ created_at }}
    </div>

</div>

</body>
</html>
